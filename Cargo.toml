[package]
name = "openmcpe"
version = "0.1.0"
edition = "2024"
rust-version = "1.87"

[profile.dev.package."*"]
opt-level = 3

[dependencies]
bytemuck = { version = "1.25.2", features = ["derive"] }
env_logger = "0.11.11"
glam = { version = "0.33.3", features = ["bytemuck"] }
log = "0.4.33"
pollster = "1.0.1"
wgpu = "30.0.0"
winit = "0.30.13"
